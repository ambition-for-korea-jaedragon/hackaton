<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muselook · 얼굴 부위별 상품 정보 시안</title>
<style>
  :root {
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --line: #d9d9de;
    --accent: #e8445a;
    --accent-soft: #fde8ec;
    --bg: #f4f2f0;
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: var(--ink);
    padding: 24px;
  }
  button { font: inherit; color: inherit; }

  /* 폰 프레임 */
  .phone {
    width: 360px;
    height: 560px;
    background: #2a2a2d;
    border: 6px solid var(--ink);
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
  }
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 14px 16px 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .5);
    background: linear-gradient(rgba(0, 0, 0, .35), transparent);
    z-index: 6;
    pointer-events: none;
  }
  .topbar span:last-child { font-weight: 500; font-size: 12px; opacity: .85; }

  /* 확대/이동 가능한 사진 영역 */
  .stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
  .stage.dragging { cursor: grabbing; }
  .world {
    position: absolute;
    left: 0; top: 0;
    width: 365px; height: 548px;      /* 사진 비율 2:3 에 맞춘 크기 */
    transform-origin: 0 0;
    will-change: transform;
  }
  .world.anim { transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
  .world img {
    display: block;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* 연결선 (화면 좌표) */
  svg.layer {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
    transition: opacity .2s;
  }
  .leader {
    stroke: #fff;
    stroke-width: 1.5;
    fill: none;
    stroke-dasharray: 4 3;
    opacity: .75;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, .6));
    transition: opacity .2s, stroke-width .2s;
  }
  .leader.on { opacity: 1; stroke-dasharray: none; stroke: var(--accent); stroke-width: 2; filter: drop-shadow(0 0 2px #fff); }

  /* 핀 (확대해도 크기 일정) */
  .pin {
    position: absolute;
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    background: rgba(255, 255, 255, .2);
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7);
    opacity: .6;
    cursor: pointer;
    z-index: 4;
    padding: 0;
    transform: scale(calc(1 / var(--k, 1)));
    transition: opacity .2s;
  }
  .pin:hover, .pin:focus-visible, .pin.on { opacity: 1; }
  .pin::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: .85;
  }
  .pin::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0;
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.6); opacity: .6; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .pin:focus-visible, .card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* 사진 위 요약 카드 (발색은 작은 원) */
  .card {
    position: absolute;
    width: 150px;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 9px 10px;
    z-index: 3;
    cursor: pointer;
    text-align: left;
    transition: border-color .2s, box-shadow .2s, transform .2s, opacity .25s;
  }
  .card.on {
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(232, 68, 90, .35);
    transform: translateY(-2px);
  }
  .card .area {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 7px;
    margin-bottom: 6px;
  }
  .card .row { display: flex; align-items: center; gap: 7px; }
  .dot {
    flex: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .card .name { font-size: 12px; font-weight: 700; line-height: 1.3; }
  .card .price { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

  .card.eye   { left: 12px;  top: 60px; }
  .card.cheek { right: 12px; top: 60px; }
  .card.lip   { left: 12px;  bottom: 18px; }

  /* 확대하면 카드는 숨기고 핀만 남겨 사진을 크게 본다 */
  .phone.zoomed .card, .phone.zoomed svg.layer { opacity: 0; pointer-events: none; }

  /* 줌 컨트롤 */
  .zoom {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
    z-index: 5;
  }
  .zoom button {
    width: 34px; height: 34px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .zoom button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zoom button:disabled { opacity: .4; cursor: default; }
  .zoom .lvl { font-size: 10.5px; color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); font-weight: 700; }

  .all-btn {
    position: absolute;
    right: 12px; bottom: 18px;
    z-index: 5;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 11px 16px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
  }
  .all-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* 바텀시트 공통 */
  .backdrop {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, .35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 8;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 22px 22px 0 0;
    padding: 18px 18px 20px;
    z-index: 9;
    transform: translateY(105%);
    visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .15);
  }
  .phone.open .backdrop, .phone.open-list .backdrop { opacity: 1; pointer-events: auto; }
  .phone.open #sheet, .phone.open-list #list-sheet {
    transform: translateY(0);
    visibility: visible;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s;
  }

  /* 전체 제품 리스트 */
  .list-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .list-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .plist { list-style: none; }
  .plist li + li { border-top: 1px solid var(--line); }
  .plist button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .plist .mini {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 10px;
    background: var(--bgc);
    overflow: hidden;
  }
  .plist .mini svg { width: 100%; height: 100%; }
  .plist .txt { flex: 1; min-width: 0; }
  .plist .t-area { font-size: 10px; font-weight: 700; color: var(--accent); }
  .plist .t-name { font-size: 13px; font-weight: 700; margin: 1px 0 3px; }
  .plist .t-shade { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .plist .t-price { font-size: 13px; font-weight: 800; }
  .plist .chev { color: var(--muted); }

  /* 상품 상세 */
  .sheet .close {
    position: absolute;
    top: 12px; right: 14px;
    width: 28px; height: 28px;
    border: 0;
    border-radius: 50%;
    background: #f0f0f2;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .sheet .top { display: flex; gap: 14px; }
  .preview {
    flex: none;
    width: 112px; height: 112px;
    border-radius: 14px;
    background: var(--bgc, #f6f1ee);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .preview svg { width: 100%; height: 100%; }
  .info { padding-right: 24px; min-width: 0; }
  .info .brand { font-size: 11px; color: var(--muted); }
  .info .pname { font-size: 15px; font-weight: 800; line-height: 1.3; margin: 2px 0 6px; }
  .info .shade { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .info .price { font-size: 16px; font-weight: 800; margin-top: 8px; }

  .specs {
    list-style: none;
    margin: 14px 0 12px;
    border-top: 1px solid var(--line);
  }
  .specs li {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .specs li span:first-child { color: var(--muted); }
  .desc { font-size: 12px; line-height: 1.55; color: #3a3a3d; margin-bottom: 14px; }

  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    border-radius: 10px;
    padding: 11px 0;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { border: 0; background: var(--ink); color: #fff; }
  .btn-ghost { border: 1.5px solid var(--line); background: #fff; }

  /* ---------- 내 얼굴에 적용하기 ---------- */
  [hidden] { display: none !important; }
  .tryon-btn {
    position: absolute;
    right: 12px; bottom: 64px;
    z-index: 5;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 11px 16px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(232, 68, 90, .5);
  }
  .tryon-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .tryon {
    position: absolute; inset: 0;
    z-index: 7;
    background: #121214;
    color: #fff;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s;
  }
  .phone.tryon-open .tryon {
    transform: none;
    visibility: visible;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s;
  }
  .tryon-head { flex: none; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
  .tryon-head button {
    width: 32px; height: 32px;
    border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, .14);
    color: #fff; font-size: 16px; cursor: pointer;
  }
  .tryon-head h2 { font-size: 14px; font-weight: 800; }
  .tryon-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }

  .t-empty { width: 100%; padding: 0 28px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .t-empty .e-title { font-size: 17px; font-weight: 800; line-height: 1.45; margin-bottom: 8px; }
  .t-empty .e-sub { font-size: 12px; color: #b9b9bf; margin-bottom: 10px; line-height: 1.5; }
  .t-btn {
    border-radius: 12px;
    padding: 13px 0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, .25);
    background: transparent;
    color: #fff;
  }
  .t-btn.primary { background: var(--accent); border-color: var(--accent); }
  .t-btn:disabled { opacity: .45; cursor: default; }
  .t-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .t-link { background: none; border: 0; color: #b9b9bf; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 6px; }
  .t-status { min-height: 18px; font-size: 12px; color: #ffd3da; line-height: 1.5; }
  .t-privacy { font-size: 10.5px; color: #8d8d94; margin-top: 4px; }

  .t-cam { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .t-cam video { width: calc(100% - 16px); max-height: 380px; border-radius: 12px; background: #000; transform: scaleX(-1); object-fit: cover; }
  .t-cam .row { display: flex; gap: 10px; }
  .t-cam .t-btn { padding: 11px 22px; }

  .cmp {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    touch-action: none;
    cursor: ew-resize;
    --pos: 50%;
  }
  .cmp canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #c-after { clip-path: inset(0 0 0 var(--pos)); }
  .cmp .tag {
    position: absolute; top: 8px;
    font-size: 10px; font-weight: 800; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(0, 0, 0, .55); color: #fff;
    pointer-events: none;
  }
  .cmp .tag-b { left: 8px; }
  .cmp .tag-a { right: 8px; background: var(--accent); }
  .handle {
    position: absolute; top: 0; bottom: 0;
    left: var(--pos);
    width: 32px; margin-left: -16px;
    cursor: ew-resize;
    outline: none;
  }
  .handle::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 15px; width: 2px;
    background: #fff; box-shadow: 0 0 6px rgba(0, 0, 0, .6);
  }
  .handle i {
    position: absolute; top: 50%; left: 50%;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .5);
    display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 11px; font-weight: 800; color: var(--ink);
  }
  .handle i::before { content: "◀ ▶"; letter-spacing: -1px; font-size: 9px; }
  .handle:focus-visible i { outline: 3px solid var(--accent); }

  .tryon-ctl { flex: none; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1.5px solid rgba(255, 255, 255, .25);
    background: transparent;
    color: #d6d6db;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
  .chip[data-on="false"] { opacity: .5; }
  .chip[data-on="false"] .dot { background: transparent; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .45); }
  .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .editor { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .editor .e-name { flex: none; width: 78px; font-weight: 800; white-space: nowrap; }
  .editor input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .editor input:disabled { opacity: .35; }
  .editor .e-val { flex: none; width: 26px; text-align: right; color: #b9b9bf; font-variant-numeric: tabular-nums; }
  .switch {
    flex: none;
    width: 38px; height: 22px;
    border: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .25);
    position: relative; cursor: pointer;
    transition: background .2s;
  }
  .switch i {
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff;
    transition: transform .2s;
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"] i { transform: translateX(16px); }
  .switch:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .t-actions { display: flex; gap: 8px; }
  .t-actions .t-btn { flex: 1; padding: 11px 0; font-size: 12.5px; }
</style>
</head>
<body>
  <main class="phone" id="phone" aria-label="얼굴 부위별 상품 정보 화면">
    <div class="topbar"><span>Muselook</span><span>Look · 시안</span></div>

    <div class="stage" id="stage">
      <!-- 사진 + 핀: 같이 확대/이동 (좌표는 사진 960x1440 기준 × 0.38) -->
      <div class="world" id="world">
        <img src="assets/face.jpg" alt="메이크업 룩 예시 모델 사진" draggable="false">
        <button class="pin" data-id="eye"   style="left:154px; top:223px;" aria-label="눈 메이크업 상품 보기"></button>
        <button class="pin" data-id="cheek" style="left:232px; top:268px;" aria-label="볼 상품 보기"></button>
        <button class="pin" data-id="lip"   style="left:196px; top:341px;" aria-label="입술 상품 보기"></button>
      </div>

      <svg class="layer" id="layer" aria-hidden="true">
        <path class="leader" data-for="eye"></path>
        <path class="leader" data-for="cheek"></path>
        <path class="leader" data-for="lip"></path>
      </svg>

      <div class="card eye" data-id="eye" role="button" tabindex="0">
        <span class="area">EYE</span>
        <div class="row"><i class="dot" style="--c:#8d6a57"></i><span class="name">브라운 섀도우 팔레트</span></div>
        <div class="price">₩24,000</div>
      </div>

      <div class="card cheek" data-id="cheek" role="button" tabindex="0">
        <span class="area">PRODUCT INFORMATION</span>
        <div class="row"><i class="dot" style="--c:#e98c8f"></i><span class="name">핑크 쿠션 블러셔</span></div>
        <div class="price">₩18,000</div>
      </div>

      <div class="card lip" data-id="lip" role="button" tabindex="0">
        <span class="area">LIP</span>
        <div class="row"><i class="dot" style="--c:#a52848"></i><span class="name">벨벳 틴트 #로즈우드</span></div>
        <div class="price">₩14,000</div>
      </div>
    </div>

    <div class="zoom" aria-label="확대/축소">
      <button id="zin" type="button" aria-label="확대">+</button>
      <div class="lvl" id="lvl">1.0×</div>
      <button id="zout" type="button" aria-label="축소">−</button>
      <button id="zreset" type="button" aria-label="원래 크기" style="font-size:13px">⟲</button>
    </div>

    <button class="tryon-btn" id="tryon-btn" type="button">✨ 내 얼굴에 적용하기</button>
    <button class="all-btn" id="all-btn" type="button">전체 제품정보 보기</button>

    <!-- 내 얼굴에 적용하기 (비포/애프터) -->
    <section class="tryon" id="tryon" aria-label="내 얼굴에 적용하기" aria-hidden="true">
      <header class="tryon-head">
        <button id="tryon-back" type="button" aria-label="돌아가기">←</button>
        <h2>내 얼굴에 적용하기</h2>
      </header>

      <div class="tryon-body" id="tryon-body">
        <div class="t-empty" id="t-empty">
          <p class="e-title">셀카를 올리면<br>이 룩을 내 얼굴에 입혀 드려요</p>
          <p class="e-sub">정면을 보는 밝은 사진일수록 잘 맞아요</p>
          <button class="t-btn primary" id="t-pick" type="button">사진 선택</button>
          <button class="t-btn" id="t-cam" type="button">웹캠으로 촬영</button>
          <button class="t-link" id="t-sample" type="button">샘플 사진으로 체험해 보기</button>
          <p class="t-status" id="t-status" role="status" aria-live="polite"></p>
          <p class="t-privacy">사진은 이 기기에서만 처리되며 서버로 전송되지 않아요.</p>

            <button class="t-btn" id="t-cam-cancel" type="button">취소</button>

        <div class="cmp" id="t-cmp" hidden>
          <canvas id="c-before"></canvas>
          <canvas id="c-after"></canvas>

          <div class="handle" id="t-handle" role="slider" tabindex="0" aria-label="비포 애프터 비교선" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></div>

      </div>

      <footer class="tryon-ctl" id="t-ctl" hidden>
        <div class="chips" id="t-chips" role="group" aria-label="메이크업 부위 선택"></div>
        <div class="editor" id="t-editor">
          <span class="e-name" id="e-name"></span>
          <button class="switch" id="e-sw" type="button" role="switch" aria-checked="true" aria-label="적용"><i></i></button>
          <input type="range" id="t-int" min="0" max="100" value="80" aria-label="농도">
          <output class="e-val" id="e-val" for="t-int">80</output>
        </div>
        <div class="t-actions">
          <button class="t-btn" id="t-retry" type="button">다른 사진</button>
          <button class="t-btn primary" id="t-save" type="button">결과 저장</button>
        </div>
      </footer>
    </section>

    <!-- 전체 제품 리스트 -->
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="list-sheet" role="dialog" aria-modal="true" aria-labelledby="l-title" aria-hidden="true">
      <button class="close" id="list-close" aria-label="닫기">×</button>
      <h2 class="list-title" id="l-title">이 룩에 사용된 제품</h2>
      <p class="list-sub" id="l-sub"></p>
      <ul class="plist" id="plist"></ul>
    </section>

    <!-- 상품 상세 -->
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-name" aria-hidden="true">
      <button class="close" id="close" aria-label="닫기">×</button>
      <div class="top">
        <div class="preview" id="s-preview"></div>
        <div class="info">
          <div class="brand" id="s-brand"></div>
          <h2 class="pname" id="s-name"></h2>
          <div class="shade"><i class="dot" id="s-dot"></i><span id="s-shade"></span></div>
          <div class="price" id="s-price"></div>
        </div>
      </div>
      <ul class="specs" id="s-specs"></ul>
      <p class="desc" id="s-desc"></p>
      <div class="actions">
        <button class="btn-ghost" type="button">내 화장품과 비교</button>
        <button class="btn-primary" type="button">구매하러 가기</button>
      </div>
    </section>
  </main>

<script>
  // 상품 미리보기 일러스트 (실제 상품 이미지로 교체 예정)
  const IMG = {
    eye: `<svg viewBox="0 0 120 120" role="img" aria-label="브라운 섀도우 팔레트 미리보기">
      <rect x="12" y="26" width="96" height="68" rx="10" fill="#3b2f2a"/>
      <rect x="12" y="26" width="96" height="14" rx="10" fill="#4a3c36"/>
      <circle cx="34" cy="62" r="13" fill="#d8b8a0"/><circle cx="60" cy="62" r="13" fill="#b98a6c"/><circle cx="86" cy="62" r="13" fill="#8d6a57"/>
      <rect x="22" y="76" width="76" height="12" rx="6" fill="#5b4338"/>
      <ellipse cx="34" cy="58" rx="6" ry="3" fill="#fff" opacity=".35"/>
    </svg>`,
    cheek: `<svg viewBox="0 0 120 120" role="img" aria-label="핑크 쿠션 블러셔 미리보기">
      <circle cx="60" cy="60" r="46" fill="#f4ede9"/>
      <circle cx="60" cy="60" r="46" fill="none" stroke="#e3d6cf" stroke-width="3"/>
      <circle cx="60" cy="60" r="32" fill="#e98c8f"/>
      <circle cx="60" cy="60" r="32" fill="url(#g)"/>
      <defs><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
      <rect x="86" y="20" width="14" height="10" rx="3" fill="#cdbdb4"/>
    </svg>`,
    lip: `<svg viewBox="0 0 120 120" role="img" aria-label="벨벳 틴트 미리보기">
      <g transform="rotate(35 60 60)">
        <rect x="48" y="14" width="24" height="26" rx="5" fill="#2b2b2e"/>
        <rect x="50" y="40" width="20" height="8" fill="#9a9aa0"/>
        <rect x="46" y="48" width="28" height="52" rx="8" fill="#a52848"/>
        <rect x="52" y="54" width="5" height="38" rx="2.5" fill="#fff" opacity=".25"/>
        <rect x="55" y="100" width="10" height="10" rx="3" fill="#a52848"/>
      </g>
    </svg>`
  };

  const DATA = {
    eye: {
      brand: '샘플 브랜드', name: '브라운 섀도우 팔레트', shade: '웜 브라운 03', color: '#8d6a57', bg: '#f6efe9',
      price: '₩24,000',
      specs: [['용량', '6g × 6색'], ['피니시', '매트 + 글리터'], ['지속력', '약 8시간']],
      desc: '은은한 웜톤 음영으로 얇은 눈매를 깊어 보이게 해 주는 데일리 팔레트입니다.'
    },
    cheek: {
      brand: '샘플 브랜드', name: '핑크 쿠션 블러셔', shade: '코랄 핑크 02', color: '#e98c8f', bg: '#fbefee',
      price: '₩18,000',
      specs: [['용량', '9g'], ['피니시', '촉촉한 세미글로우'], ['지속력', '약 6시간']],
      desc: '쿠션 타입이라 얇게 발려 밀림이 적고, 화사한 혈색을 연출합니다.'
    },
    lip: {
      brand: '샘플 브랜드', name: '벨벳 틴트 #로즈우드', shade: '로즈우드 07', color: '#a52848', bg: '#fbeef1',
      price: '₩14,000',
      specs: [['용량', '4.2g'], ['피니시', '벨벳 매트'], ['지속력', '약 7시간']],
      desc: '가볍게 발리는 벨벳 질감의 틴트로, 가지고 있는 립 제품으로 대체 가능한지 비교할 수 있습니다.'
    }
  };
  const AREA = { eye: 'EYE', cheek: 'CHEEK', lip: 'LIP' };

  /* ---------- 확대 / 이동 ---------- */
  const phone = document.getElementById('phone');
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const layer = document.getElementById('layer');
  const W = 365, H = 548;                 // world 크기
  const MAX_K = 4, MIN_K = 1;
  let SW = stage.clientWidth, SH = stage.clientHeight;
  let k = 1, tx = (SW - W) / 2, ty = 0;
  let rafId = 0;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function applyView() {
    tx = clamp(tx, Math.min(0, SW - W * k), Math.max(0, (SW - W * k)));
    ty = clamp(ty, Math.min(0, SH - H * k), 0);
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
    world.style.setProperty('--k', k);
    phone.classList.toggle('zoomed', k > 1.15);
    document.getElementById('lvl').textContent = k.toFixed(1) + '×';
    document.getElementById('zin').disabled = k >= MAX_K - 0.01;
    document.getElementById('zout').disabled = k <= MIN_K + 0.01;
    drawLeaders();
  }

  function zoomAt(cx, cy, nk) {
    nk = clamp(nk, MIN_K, MAX_K);
    tx = cx - (cx - tx) * (nk / k);
    ty = cy - (cy - ty) * (nk / k);
    k = nk;
    applyView();
  }

  // 부드러운 이동 중에는 연결선도 매 프레임 갱신
  function animateView(fn) {
    world.classList.add('anim');
    fn();
    cancelAnimationFrame(rafId);
    const t0 = performance.now();
    (function loop(t) {
      drawLeaders();
      if (t - t0 < 500) rafId = requestAnimationFrame(loop);
      else world.classList.remove('anim');
    })(t0);
  }

  function resetView() {
    animateView(() => { k = 1; tx = (SW - W) / 2; ty = 0; applyView(); });
  }

  function focusOn(id) {
    const pin = world.querySelector(`.pin[data-id="${id}"]`);
    const px = parseFloat(pin.style.left), py = parseFloat(pin.style.top);
    animateView(() => {
      k = 2.6;
      tx = SW / 2 - px * k;     // 가로 중앙
      ty = 118 - py * k;        // 시트에 가리지 않는 상단 쪽
      applyView();
    });
  }

  document.getElementById('zin').addEventListener('click', () => animateView(() => zoomAt(SW / 2, SH / 2, k * 1.5)));
  document.getElementById('zout').addEventListener('click', () => animateView(() => zoomAt(SW / 2, SH / 2, k / 1.5)));
  document.getElementById('zreset').addEventListener('click', resetView);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, k * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  }, { passive: false });

  // 드래그로 이동, 손가락 두 개로 핀치 확대
  const pts = new Map();
  let drag = null, pinch = null;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin, .card, .zoom, .all-btn')) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, tx, ty, moved: false };
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k };
    }
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      const r = stage.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
    } else if (drag) {
      tx = drag.tx + (e.clientX - drag.x);
      ty = drag.ty + (e.clientY - drag.y);
      applyView();
    }
  });
  const endPointer = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) { drag = null; stage.classList.remove('dragging'); }
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('dblclick', e => {
    if (e.target.closest('.pin, .card')) return;
    const r = stage.getBoundingClientRect();
    animateView(() => (k > 1.2 ? (k = 1, tx = (SW - W) / 2, ty = 0, applyView())
                                : zoomAt(e.clientX - r.left, e.clientY - r.top, 2.6)));
  });

  /* ---------- 연결선 ---------- */
  const cards = document.querySelectorAll('.card');
  const pins = document.querySelectorAll('.pin');
  const leaders = document.querySelectorAll('.leader');

  function drawLeaders() {
    const sr = stage.getBoundingClientRect();
    leaders.forEach(l => {
      const id = l.dataset.for;
      const c = stage.querySelector(`.card[data-id="${id}"]`).getBoundingClientRect();
      const p = world.querySelector(`.pin[data-id="${id}"]`).getBoundingClientRect();
      const px = p.left + p.width / 2 - sr.left, py = p.top + p.height / 2 - sr.top;
      const cx = c.left + c.width * (id === 'lip' ? .45 : .5) - sr.left;
      const cy = (id === 'lip' ? c.top : c.bottom) - sr.top;
      l.setAttribute('d', `M${cx} ${cy} L${px} ${py}`);
    });
  }

  function mark(id) {
    cards.forEach(c => c.classList.toggle('on', c.dataset.id === id));
    pins.forEach(p => p.classList.toggle('on', p.dataset.id === id));
    leaders.forEach(l => l.classList.toggle('on', l.dataset.for === id));
  }

  /* ---------- 시트 ---------- */
  const sheet = document.getElementById('sheet');
  const listSheet = document.getElementById('list-sheet');
  let lastFocus = null;
  let fromList = false;

  function openSheet(id) {
    const d = DATA[id];
    if (!phone.classList.contains('open-list')) lastFocus = document.activeElement;
    fromList = phone.classList.contains('open-list');
    phone.classList.remove('open-list');
    listSheet.setAttribute('aria-hidden', 'true');
    document.getElementById('s-preview').innerHTML = IMG[id];
    document.getElementById('s-preview').style.setProperty('--bgc', d.bg);
    document.getElementById('s-brand').textContent = d.brand;
    document.getElementById('s-name').textContent = d.name;
    document.getElementById('s-shade').textContent = d.shade;
    document.getElementById('s-dot').style.setProperty('--c', d.color);
    document.getElementById('s-price').textContent = d.price;
    document.getElementById('s-desc').textContent = d.desc;
    document.getElementById('s-specs').innerHTML =
      d.specs.map(([kk, v]) => `<li><span>${kk}</span><span>${v}</span></li>`).join('');
    mark(id);
    focusOn(id);                         // 해당 부위를 확대해서 메이크업을 자세히 보여준다
    phone.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.getElementById('close').focus({ preventScroll: true });
  }

  function openList() {
    lastFocus = document.activeElement;
    phone.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    mark(null);
    resetView();
    phone.classList.add('open-list');
    listSheet.setAttribute('aria-hidden', 'false');
    document.getElementById('list-close').focus({ preventScroll: true });
  }

  function closeSheet() {
    if (phone.classList.contains('open') && fromList) {
      fromList = false;
      openList();
      return;
    }
    phone.classList.remove('open', 'open-list');
    sheet.setAttribute('aria-hidden', 'true');
    listSheet.setAttribute('aria-hidden', 'true');
    mark(null);
    resetView();
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }

  const ids = Object.keys(DATA);
  document.getElementById('l-sub').textContent = `총 ${ids.length}개 제품`;
  document.getElementById('plist').innerHTML = ids.map(id => {
    const d = DATA[id];
    return `<li><button type="button" data-id="${id}">
      <span class="mini" style="--bgc:${d.bg}">${IMG[id]}</span>
      <span class="txt">
        <div class="t-area">${AREA[id]}</div>
        <div class="t-name">${d.name}</div>
        <div class="t-shade"><i class="dot" style="--c:${d.color}"></i>${d.shade}</div>
      </span>
      <span class="t-price">${d.price}</span><span class="chev">›</span>
    </button></li>`;
  }).join('');
  document.querySelectorAll('#plist button').forEach(b =>
    b.addEventListener('click', () => openSheet(b.dataset.id)));

  pins.forEach(p => p.addEventListener('click', () => openSheet(p.dataset.id)));
  cards.forEach(c => {
    c.addEventListener('click', () => openSheet(c.dataset.id));
    c.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSheet(c.dataset.id); }
    });
  });
  document.getElementById('all-btn').addEventListener('click', openList);
  document.getElementById('list-close').addEventListener('click', closeSheet);
  document.getElementById('close').addEventListener('click', closeSheet);
  document.getElementById('backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- 내 얼굴에 적용하기 (얼굴 인식 → 메이크업 합성 → 비포/애프터) ---------- */
  const $ = id => document.getElementById(id);
  const ITEMS = [
    { id: 'eye',   label: '섀도우',     full: '아이섀도우', color: DATA.eye.color },
    { id: 'cheek', label: '블러셔',     full: '블러셔',     color: DATA.cheek.color },
    { id: 'lip',   label: '립',         full: '립',         color: DATA.lip.color },
    { id: 'brow',  label: '눈썹',       full: '눈썹',       color: '#4a3626' },
    { id: 'liner', label: '라이너',     full: '아이라이너', color: '#1a1a1a' },
    { id: 'aegyo', label: '애교살',     full: '애교살',     color: '#f0cdb9' },
    { id: 'high',  label: '하이라이터', full: '하이라이터', color: '#fbe9cf' }
  ];
  const T = {
    lm: null, w: 0, h: 0, pos: 50, stream: null, landmarker: null, layer: null,
    sel: 'eye',
    items: Object.fromEntries(ITEMS.map(it => [it.id, { on: true, v: 80 }]))   // 부위별 켜짐/농도
  };
  const cBefore = $('c-before'), cAfter = $('c-after'), cmp = $('t-cmp'), handle = $('t-handle');
  let tryonFocus = null;

  // MediaPipe Face Mesh 랜드마크 번호
  const LIP_OUT = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];
  const LIP_IN  = [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
  const EYE_R_LID = [33,246,161,160,159,158,157,173,133];     // 사진 기준 왼쪽 눈(윗꺼풀)
  const EYE_L_LID = [263,466,388,387,386,385,384,398,362];    // 사진 기준 오른쪽 눈(윗꺼풀)
  const EYE_R_LOW = [33,7,163,144,145,153,154,155,133];       // 아랫눈꺼풀
  const EYE_L_LOW = [263,249,390,373,374,380,381,382,362];
  const BROW_R = { up: [70,63,105,66,107], low: [46,53,52,65,55] };
  const BROW_L = { up: [300,293,334,296,336], low: [276,283,282,295,285] };

  function tryonView(state, msg = '') {
    $('t-empty').hidden = !(state === 'empty' || state === 'busy');
    $('t-camview').hidden = state !== 'cam';
    cmp.hidden = state !== 'result';
    $('t-ctl').hidden = state !== 'result';
    $('t-status').textContent = msg;
    ['t-pick', 't-cam', 't-sample'].forEach(id => { $(id).disabled = state === 'busy'; });
  }

  function openTryon() {
    tryonFocus = document.activeElement;
    phone.classList.add('tryon-open');
    $('tryon').setAttribute('aria-hidden', 'false');
    if (!T.lm) tryonView('empty');
    $('tryon-back').focus({ preventScroll: true });
  }
  function closeTryon() {
    stopCam();
    phone.classList.remove('tryon-open');
    $('tryon').setAttribute('aria-hidden', 'true');
    if (tryonFocus) tryonFocus.focus({ preventScroll: true });
  }

  async function getLandmarker() {
    if (T.landmarker) return T.landmarker;
    if (location.protocol === 'file:') throw new Error('file-protocol');
    const { FilesetResolver, FaceLandmarker } = await import('./assets/mediapipe/vision_bundle.mjs');
    const fileset = await FilesetResolver.forVisionTasks('./assets/mediapipe/wasm');
    T.landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: './assets/mediapipe/face_landmarker.task', delegate: 'CPU' },
      runningMode: 'IMAGE',
      numFaces: 1
    });
    return T.landmarker;
  }

  async function loadSource(src) {
    tryonView('busy', '얼굴을 찾는 중이에요… (처음엔 몇 초 걸려요)');
    try {
      const blob = src instanceof Blob ? src : await (await fetch(src)).blob();
      const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      const s = Math.min(1, 1080 / Math.max(bmp.width, bmp.height));
      T.w = Math.round(bmp.width * s); T.h = Math.round(bmp.height * s);
      cBefore.width = cAfter.width = T.w;
      cBefore.height = cAfter.height = T.h;
      cBefore.getContext('2d').drawImage(bmp, 0, 0, T.w, T.h);

      const lmk = await getLandmarker();
      const res = lmk.detect(cBefore);
      if (!res.faceLandmarks.length) {
        T.lm = null;
        tryonView('empty', '얼굴을 찾지 못했어요. 얼굴이 크게 나온 정면 사진으로 다시 시도해 주세요.');
        return;
      }
      T.lm = res.faceLandmarks[0].map(p => ({ x: p.x * T.w, y: p.y * T.h }));
      tryonView('result');
      fitCmp();
      render();
      setPos(50);
    } catch (err) {
      console.error(err);
      T.lm = null;
      tryonView('empty', err.message === 'file-protocol'
        ? '이 기능은 로컬 서버로 열어야 동작해요. mockups 폴더의 start-demo.bat 을 실행해 주세요.'
        : '사진을 처리하지 못했어요. 다른 사진으로 다시 시도해 주세요.');
    }
  }

  function fitCmp() {
    const b = $('tryon-body');
    const s = Math.min((b.clientWidth - 16) / T.w, (b.clientHeight - 16) / T.h);
    cmp.style.width = Math.floor(T.w * s) + 'px';
    cmp.style.height = Math.floor(T.h * s) + 'px';
  }

  const hexA = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  };
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function render() {
    if (!T.lm) return;
    const L = T.lm;
    const a = cAfter.getContext('2d');
    a.clearRect(0, 0, T.w, T.h);
    a.drawImage(cBefore, 0, 0);

    const layer = T.layer || (T.layer = document.createElement('canvas'));
    layer.width = T.w; layer.height = T.h;
    const lc = layer.getContext('2d');
    const faceW = dist(L[234], L[454]);
    const col = id => ITEMS.find(it => it.id === id).color;

    const norm = v => { const m = Math.hypot(v.x, v.y) || 1; return { x: v.x / m, y: v.y / m }; };
    const up = norm({ x: L[10].x - L[152].x, y: L[10].y - L[152].y });
    const dn = { x: -up.x, y: -up.y };
    const mid = (i, j) => ({ x: (L[i].x + L[j].x) / 2, y: (L[i].y + L[j].y) / 2 });
    const trace = (c, pts) => pts.forEach((p, n) => (n ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
    const taper = (j, n) => Math.pow(Math.sin(Math.PI * (j + 0.5) / n), 0.7);   // 눈 양끝은 얇게
    const shift = (idxs, dir, h) => idxs.map((i, j) => ({
      x: L[i].x + dir.x * h * taper(j, idxs.length), y: L[i].y + dir.y * h * taper(j, idxs.length)
    }));

    const EYES = [
      { lid: EYE_R_LID, low: EYE_R_LOW, out: 33,  inn: 133, cheek: [117, 118], ear: 234 },
      { lid: EYE_L_LID, low: EYE_L_LOW, out: 263, inn: 362, cheek: [346, 347], ear: 454 }
    ];
    EYES.forEach(e => { e.w = dist(L[e.out], L[e.inn]); });

    // 한 부위를 따로 그린 뒤 블러 + 블렌드로 피부에 얹는다 (농도 = 부위별 슬라이더)
    const paint = (id, draw, { blur = 0, alpha = 1, blend = 'multiply' }) => {
      const it = T.items[id];
      if (!it.on || it.v === 0) return;
      lc.clearRect(0, 0, T.w, T.h);
      draw(lc);
      a.save();
      a.globalCompositeOperation = blend;
      a.globalAlpha = Math.min(1, alpha * it.v / 80);
      a.filter = blur ? `blur(${blur}px)` : 'none';
      a.drawImage(layer, 0, 0);
      a.restore();
    };
    const glow = (c, x, y, rx, ry, rot, rgb) => {          // 부드러운 타원형 그라데이션
      c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(${rgb}, 1)`); g.addColorStop(1, `rgba(${rgb}, 0)`);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill(); c.restore();
    };
    const rgbOf = hex => { const n = parseInt(hex.slice(1), 16); return `${n >> 16}, ${(n >> 8) & 255}, ${n & 255}`; };

    // 1) 블러셔
    paint('cheek', c => {
      const rgb = rgbOf(col('cheek')), r = faceW * 0.17;
      [[205, 234], [425, 454]].forEach(([p, q]) =>
        glow(c, L[p].x * 0.8 + L[q].x * 0.2, L[p].y * 0.8 + L[q].y * 0.2, r, r, 0, rgb));
    }, { alpha: 0.6 });

    // 2) 하이라이터: 광대, 눈 앞머리, 콧대
    paint('high', c => {
      EYES.forEach(e => {
        const p = mid(e.cheek[0], e.cheek[1]);
        glow(c, p.x, p.y, faceW * 0.11, faceW * 0.05, Math.atan2(L[e.ear].y - p.y, L[e.ear].x - p.x), '255, 244, 225');
        glow(c, L[e.inn].x, L[e.inn].y, faceW * 0.035, faceW * 0.035, 0, '255, 244, 225');
      });
      c.strokeStyle = 'rgba(255, 244, 225, .9)';
      c.lineWidth = faceW * 0.022; c.lineCap = 'round';
      c.beginPath(); trace(c, [168, 6, 197, 195].map(i => L[i])); c.stroke();
    }, { blur: faceW * 0.01, alpha: 0.6, blend: 'screen' });

    // 3) 애교살: 아랫눈꺼풀 밑의 밝은 띠 + 아래쪽 은은한 음영선
    paint('aegyo', c => {
      c.fillStyle = '#f8dccb';
      EYES.forEach(e => {
        const near = shift(e.low, dn, e.w * 0.10), far = shift(e.low, dn, e.w * 0.28);
        c.beginPath(); trace(c, near); trace(c, far.reverse()); c.closePath(); c.fill();
      });
    }, { blur: faceW * 0.006, alpha: 0.6, blend: 'screen' });
    paint('aegyo', c => {
      c.strokeStyle = '#a9786a'; c.lineCap = 'round';
      EYES.forEach(e => {
        c.lineWidth = e.w * 0.05;
        c.beginPath(); trace(c, shift(e.low, dn, e.w * 0.36)); c.stroke();
      });
    }, { blur: faceW * 0.005, alpha: 0.45 });

    // 4) 아이섀도우: 윗눈꺼풀에서 위로 번지는 그라데이션
    paint('eye', c => {
      c.fillStyle = col('eye');
      EYES.forEach(e => {
        const lid = e.lid.map(i => L[i]);
        const crease = shift(e.lid, up, e.w * 0.5);
        c.beginPath(); trace(c, lid); trace(c, crease.reverse()); c.closePath(); c.fill();
      });
    }, { blur: faceW * 0.022, alpha: 0.95 });

    // 5) 아이라이너: 윗속눈썹 라인 + 눈꼬리 캣아이
    paint('liner', c => {
      c.strokeStyle = c.fillStyle = col('liner');
      c.lineCap = c.lineJoin = 'round';
      EYES.forEach(e => {
        const lid = e.lid.map(i => L[i]);
        c.lineWidth = faceW * 0.008; c.beginPath(); trace(c, lid); c.stroke();
        c.lineWidth = faceW * 0.014; c.beginPath(); trace(c, lid.slice(0, 4)); c.stroke();
        const out = L[e.out], d = norm({ x: out.x - L[e.inn].x, y: out.y - L[e.inn].y });
        const tip = { x: out.x + d.x * faceW * 0.05 + up.x * faceW * 0.02, y: out.y + d.y * faceW * 0.05 + up.y * faceW * 0.02 };
        c.beginPath(); c.moveTo(L[e.lid[1]].x, L[e.lid[1]].y); c.lineTo(tip.x, tip.y); c.lineTo(out.x, out.y); c.closePath(); c.fill();
      });
    }, { blur: faceW * 0.0025, alpha: 0.95 });

    // 6) 눈썹: 눈썹 영역을 채워 진하게
    paint('brow', c => {
      c.fillStyle = col('brow');
      [BROW_R, BROW_L].forEach(b => {
        c.beginPath(); trace(c, b.up.map(i => L[i])); trace(c, b.low.map(i => L[i]).reverse()); c.closePath(); c.fill();
      });
    }, { blur: faceW * 0.004, alpha: 0.7 });

    // 7) 립
    const lips = c => {
      c.fillStyle = col('lip');
      c.beginPath(); trace(c, LIP_OUT.map(i => L[i])); c.closePath();
      trace(c, LIP_IN.map(i => L[i])); c.closePath();
      c.fill('evenodd');
    };
    paint('lip', lips, { blur: faceW * 0.004, alpha: 0.85 });
    paint('lip', lips, { blur: faceW * 0.004, alpha: 0.25, blend: 'source-over' });
  }

  function setPos(p) {
    T.pos = clamp(p, 0, 100);
    cmp.style.setProperty('--pos', T.pos + '%');
    handle.setAttribute('aria-valuenow', Math.round(T.pos));
  }
  const dragTo = e => {
    const r = cmp.getBoundingClientRect();
    setPos((e.clientX - r.left) / r.width * 100);
  };
  cmp.addEventListener('pointerdown', e => { cmp.setPointerCapture(e.pointerId); dragTo(e); });
  cmp.addEventListener('pointermove', e => { if (cmp.hasPointerCapture(e.pointerId)) dragTo(e); });
  handle.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); setPos(T.pos - 5); }
    if (e.key === 'ArrowRight') { e.preventDefault(); setPos(T.pos + 5); }
  });

  async function startCam() {
    try {
      T.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
      const v = $('t-video');
      v.srcObject = T.stream;
      await v.play();
      tryonView('cam');
    } catch (err) {
      console.error(err);
      tryonView('empty', '카메라를 사용할 수 없어요. 권한을 확인하거나 사진을 직접 선택해 주세요.');
    }
  }
  function stopCam() {
    if (T.stream) T.stream.getTracks().forEach(t => t.stop());
    T.stream = null;
  }
  function shoot() {
    const v = $('t-video');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    const x = c.getContext('2d');
    x.translate(c.width, 0); x.scale(-1, 1);     // 거울 모드로 촬영
    x.drawImage(v, 0, 0);
    stopCam();
    c.toBlob(b => loadSource(b), 'image/jpeg', 0.92);
  }

  $('tryon-btn').addEventListener('click', openTryon);
  $('tryon-back').addEventListener('click', closeTryon);
  $('t-pick').addEventListener('click', () => $('t-file').click());
  $('t-file').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) loadSource(f);
  });
  $('t-sample').addEventListener('click', () => loadSource('./assets/face.jpg'));
  $('t-cam').addEventListener('click', startCam);
  $('t-cam-cancel').addEventListener('click', () => { stopCam(); tryonView('empty'); });
  $('t-shot').addEventListener('click', shoot);
  $('t-retry').addEventListener('click', () => { T.lm = null; tryonView('empty'); });
  /* 부위 선택 / 켜기·끄기 / 농도 */
  const chipsEl = $('t-chips');
  chipsEl.innerHTML = ITEMS.map(it =>
    `<button class="chip" type="button" data-id="${it.id}" aria-pressed="false" data-on="true"><i class="dot" style="--c:${it.color}"></i>${it.label}</button>`).join('');

  function syncEditor() {
    const it = ITEMS.find(x => x.id === T.sel), st = T.items[T.sel];
    chipsEl.querySelectorAll('.chip').forEach(ch => {
      ch.setAttribute('aria-pressed', ch.dataset.id === T.sel);
      ch.dataset.on = T.items[ch.dataset.id].on;
    });
    $('e-name').textContent = it.full;
    $('e-sw').setAttribute('aria-checked', st.on);
    $('e-sw').setAttribute('aria-label', it.full + ' 적용');
    $('t-int').value = st.v;
    $('t-int').disabled = !st.on;
    $('t-int').setAttribute('aria-label', it.full + ' 농도');
    $('e-val').textContent = st.v;
  }
  chipsEl.addEventListener('click', e => {
    const ch = e.target.closest('.chip');
    if (!ch) return;
    T.sel = ch.dataset.id;
    syncEditor();
    ch.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  });
  $('e-sw').addEventListener('click', () => {
    T.items[T.sel].on = !T.items[T.sel].on;
    syncEditor(); render();
  });
  $('t-int').addEventListener('input', e => {
    T.items[T.sel].v = +e.target.value;
    $('e-val').textContent = e.target.value;
    render();
  });
  syncEditor();
  $('t-save').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'muselook-result.png';
    link.href = cAfter.toDataURL('image/png');
    link.click();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && phone.classList.contains('tryon-open')) closeTryon();
  });

  applyView();
  window.addEventListener('load', applyView);
</script>
</body>
</html>
